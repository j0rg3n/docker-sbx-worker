# Host-side pull-through caches. Bound to 127.0.0.1 only; sandboxes reach them as
# host.docker.internal:<port> once `sbx policy allow network localhost:<port>` is set.
# Started per project by `sbx-worker up`, only for the ecosystems the project lists.
name: sbx-worker-proxies

services:
  verdaccio:                      # npm
    image: verdaccio/verdaccio:6.10.4
    ports: ["127.0.0.1:4873:4873"]
    environment:
      VERDACCIO_PUBLIC_URL: http://host.docker.internal:4873/
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio-storage:/verdaccio/storage
    restart: unless-stopped

  proxpi:                         # PyPI (pip, uv)
    image: epicwink/proxpi:1.3.0
    ports: ["127.0.0.1:5000:5000"]
    environment:
      PROXPI_INDEX_URL: https://pypi.org/simple/
      PROXPI_CACHE_DIR: /var/cache/proxpi
      PROXPI_CACHE_SIZE: "53687091200"   # 50 GB: evicted files would be served as redirects
      # proxpi redirects to files.pythonhosted.org when a download takes longer than this,
      # which an isolated client cannot follow. Wait instead.
      PROXPI_DOWNLOAD_TIMEOUT: "600"
    volumes:
      - proxpi-cache:/var/cache/proxpi
    restart: unless-stopped

  bagetter:                       # NuGet
    image: bagetter/bagetter:1.6.5
    ports: ["127.0.0.1:5555:8080"]
    environment:
      Mirror__Enabled: "true"
      Mirror__PackageSource: https://api.nuget.org/v3/index.json
      # BaGetter accepts pushes from anyone when ApiKey is empty. sbx-worker generates
      # this key into ~/.config/sbx-worker/proxies.env and never gives it to a sandbox.
      ApiKey: ${BAGETTER_API_KEY:?run via sbx-worker, which generates proxies.env}
      AllowPackageOverwrites: "false"
      Storage__Type: FileSystem
      Storage__Path: /data
      Database__Type: Sqlite
      Database__ConnectionString: Data Source=/data/db/bagetter.db
      Search__Type: Database
    volumes:
      - bagetter-data:/data
    restart: unless-stopped

volumes:
  verdaccio-storage:
  proxpi-cache:
  bagetter-data:
